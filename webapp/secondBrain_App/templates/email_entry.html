{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="onboarding-page-center">
    <div class="onboarding-container">
        <div class="form-card">
            <header class="form-header">
                <div class="logo-container">
                    <img src="{% static 'images/logo.svg' %}" alt="BrainWave Logo" class="logo">
                </div>
                <h1>Welcome to BrainWave</h1>
                <p>Enter your email to start your personalized focus journey</p>
            </header>

            <form id="email-form" method="post" action="/send-otp/">
                {% csrf_token %}
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="Enter your email address"
                        required
                    >
                </div>
                
                <button type="submit" class="continue-btn">
                    Send OTP
                    <svg class="arrow-icon" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                        <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('email-form');
    const emailInput = document.getElementById('email');
    const submitBtn = form.querySelector('button[type="submit"]');
    
    // Validate email in real-time
    function validateEmail() {
        const email = emailInput.value.trim();
        const isValid = email && email.includes('@') && email.includes('.');
        submitBtn.disabled = !isValid;
    }
    
    emailInput.addEventListener('input', validateEmail);
    validateEmail(); // Initial validation
});
</script>
{% endblock %}
