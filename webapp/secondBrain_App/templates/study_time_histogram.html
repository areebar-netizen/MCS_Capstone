<!-- Study Time Histogram Component -->
<div class="card study-time-histogram">
    <div class="card-header">
        <h2 class="card-title">Study Time Analysis</h2>
        <div class="time-view-toggle">
            <button class="view-btn btn-deselected" data-view="week">Week</button>
            <button class="view-btn btn-deselected" data-view="month">Month</button>
            <button class="view-btn btn-deselected" data-view="year">Year</button>
        </div>
    </div>
    
    <div class="card-content">
        <!-- Week View -->
        <div class="histogram-view" id="weekView">
            <div class="time-labels">
                <span>Sun</span>
                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span>Sat</span>
            </div>
            <div class="histogram-bars">
                <div class="bar" style="height: 60%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 80%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 45%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 90%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 70%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 85%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 40%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
            </div>
        </div>

        <!-- Month View (Hidden by default) -->
        <div class="histogram-view" id="monthView" style="display: none;">
            <div class="time-labels">
                <span>Week 1</span>
                <span>Week 2</span>
                <span>Week 3</span>
                <span>Week 4</span>
            </div>
            <div class="histogram-bars">
                <div class="bar" style="height: 75%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 85%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 60%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 90%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
            </div>
        </div>

        <!-- Year View (Hidden by default) -->
        <div class="histogram-view" id="yearView" style="display: none;">
            <div class="time-labels">
                <span>Jan</span>
                <span>Feb</span>
                <span>Mar</span>
                <span>Apr</span>
                <span>May</span>
                <span>Jun</span>
                <span>Jul</span>
                <span>Aug</span>
                <span>Sep</span>
                <span>Oct</span>
                <span>Nov</span>
                <span>Dec</span>
            </div>
            <div class="histogram-bars">
                <div class="bar" style="height: 65%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 70%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 80%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 55%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 90%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 85%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 75%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 60%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 70%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 80%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 65%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
                <div class="bar" style="height: 70%; background: linear-gradient(to right, #fe938c, rgba(254, 147, 140, 0.3));"></div>
            </div>
        </div>

        <div class="histogram-stats">
            <div class="stat">
                <span class="stat-label">Total Study Time</span>
                <span class="stat-value">24h 35min</span>
            </div>
            <div class="stat">
                <span class="stat-label">Daily Average</span>
                <span class="stat-value">3h 30min</span>
            </div>
            <div class="stat">
                <span class="stat-label">Best Day</span>
                <span class="stat-value">Wednesday</span>
            </div>
        </div>
    </div>
</div>
