<!-- Progress Tracker Component -->
<style>
/* ── Progress Tracker ─────────────────────────────── */
.progress-tracker {
    font-family: inherit;
}

.progress-chart-container {
    position: relative;
    height: 200px;
    width: 100%;
    margin-top: 12px;
}

.progress-filter-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.progress-filter-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: #666;
}

.progress-filter-select {
    padding: 8px 12px;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    font-size: 0.85rem;
    color: #333;
    background: #fff;
    cursor: pointer;
    transition: border-color 0.2s;
}

.progress-filter-select:hover {
    border-color: #FF9168;
}

.progress-filter-select:focus {
    outline: none;
    border-color: #FF9168;
}

.progress-stats-summary {
    display: flex;
    gap: 24px;
    margin-bottom: 16px;
    padding: 12px 16px;
    background: #f8f9fa;
    border-radius: 8px;
}

.progress-stat-item {
    display: flex;
    flex-direction: column;
}

.progress-stat-value {
    font-size: 1.2rem;
    font-weight: 700;
    color: #222;
}

.progress-stat-label {
    font-size: 0.75rem;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.no-data-message {
    text-align: center;
    padding: 40px 20px;
    color: #999;
    font-size: 0.9rem;
}
</style>

<!-- Progress Tracker Component -->
<div class="card progress-tracker">
    <div class="card-header">
        <h2 class="card-title">Progress Tracker</h2>
        <p class="card-subtitle">Your focus improvement journey</p>
    </div>

    <div class="card-content">
        <!-- Subject Filter -->
        <div class="progress-filter-row">
            <span class="progress-filter-label">Filter by Subject:</span>
            <select id="progressSubjectFilter" class="progress-filter-select">
                <option value="">All Subjects</option>
            </select>
        </div>

        <!-- Stats Summary -->
        <div class="progress-stats-summary" id="progressStatsSummary">
            <div class="progress-stat-item">
                <span class="progress-stat-value" id="avgFocusScore">0.0</span>
                <span class="progress-stat-label">Avg Focus</span>
            </div>
            <div class="progress-stat-item">
                <span class="progress-stat-value" id="totalSessionsCount">0</span>
                <span class="progress-stat-label">Sessions</span>
            </div>
            <div class="progress-stat-item">
                <span class="progress-stat-value" id="trendIndicator">--</span>
                <span class="progress-stat-label">Trend</span>
            </div>
        </div>

        <!-- Line Chart Container -->
        <div class="progress-chart-container">
            <canvas id="progressChart"></canvas>
        </div>

        <!-- No Data Message -->
        <div id="noDataMessage" class="no-data-message" style="display: none;">
            No session data available. Complete a session to see your progress.
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
let progressChart = null;

async function loadProgressTrackerData(subjectFilter = '') {
    try {
        const response = await fetch(`/api/progress-tracker-data/?subject=${encodeURIComponent(subjectFilter)}`);
        
        if (!response.ok) {
            throw new Error('Failed to load progress tracker data');
        }
        
        const data = await response.json();
        
        // Update subject filter dropdown
        updateSubjectFilter(data.subjects, data.current_filter);
        
        // Update chart
        updateProgressChart(data.data);
        
        // Update stats summary
        updateStatsSummary(data.data);
        
    } catch (error) {
        console.error('Error loading progress tracker data:', error);
    }
}

function updateSubjectFilter(subjects, currentFilter) {
    const select = document.getElementById('progressSubjectFilter');
    if (!select) return;
    
    // Save current selection
    const currentValue = select.value;
    
    // Clear existing options
    select.innerHTML = '<option value="">All Subjects</option>';
    
    // Add subject options
    subjects.forEach(subject => {
        const option = document.createElement('option');
        option.value = subject;
        option.textContent = subject;
        if (subject === currentFilter) {
            option.selected = true;
        }
        select.appendChild(option);
    });
    
    // Restore selection if it still exists
    if (subjects.includes(currentValue)) {
        select.value = currentValue;
    }
}

function updateProgressChart(graphData) {
    const canvas = document.getElementById('progressChart');
    const noDataMessage = document.getElementById('noDataMessage');
    
    if (!graphData || graphData.length === 0) {
        if (canvas) canvas.style.display = 'none';
        if (noDataMessage) noDataMessage.style.display = 'block';
        
        if (progressChart) {
            progressChart.destroy();
            progressChart = null;
        }
        return;
    }
    
    if (canvas) canvas.style.display = 'block';
    if (noDataMessage) noDataMessage.style.display = 'none';
    
    // Prepare data for Chart.js
    const labels = graphData.map(d => d.date);
    const focusScores = graphData.map(d => d.focus_score);
    
    // Destroy existing chart if it exists
    if (progressChart) {
        progressChart.destroy();
    }
    
    // Create new chart
    const ctx = canvas.getContext('2d');
    progressChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Focus Score',
                data: focusScores,
                borderColor: '#FF9168',
                backgroundColor: 'rgba(255, 145, 104, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.3,
                pointRadius: 4,
                pointBackgroundColor: '#FF9168',
                pointBorderColor: '#fff',
                pointBorderWidth: 2,
                pointHoverRadius: 6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    titleFont: {
                        size: 13,
                        weight: 'bold'
                    },
                    bodyFont: {
                        size: 12
                    },
                    padding: 12,
                    cornerRadius: 8,
                    callbacks: {
                        title: function(context) {
                            return 'Date: ' + context[0].label;
                        },
                        label: function(context) {
                            return 'Focus Score: ' + context.parsed.y.toFixed(1) + '/10';
                        }
                    }
                }
            },
            scales: {
                x: {
                    display: true,
                    title: {
                        display: true,
                        text: 'Date',
                        font: {
                            size: 12,
                            weight: '600'
                        },
                        color: '#666'
                    },
                    ticks: {
                        font: {
                            size: 11
                        },
                        color: '#999',
                        maxRotation: 45,
                        minRotation: 45
                    },
                    grid: {
                        display: false
                    }
                },
                y: {
                    display: true,
                    title: {
                        display: true,
                        text: 'Focus Score (0-10)',
                        font: {
                            size: 12,
                            weight: '600'
                        },
                        color: '#666'
                    },
                    min: 0,
                    max: 10,
                    ticks: {
                        font: {
                            size: 11
                        },
                        color: '#999',
                        stepSize: 2
                    },
                    grid: {
                        color: '#f0f0f0'
                    }
                }
            }
        }
    });
}

function updateStatsSummary(graphData) {
    const avgFocusEl = document.getElementById('avgFocusScore');
    const totalSessionsEl = document.getElementById('totalSessionsCount');
    const trendEl = document.getElementById('trendIndicator');
    
    if (!graphData || graphData.length === 0) {
        if (avgFocusEl) avgFocusEl.textContent = '0.0';
        if (totalSessionsEl) totalSessionsEl.textContent = '0';
        if (trendEl) trendEl.textContent = '--';
        return;
    }
    
    // Calculate average focus
    const avgFocus = graphData.reduce((sum, d) => sum + d.focus_score, 0) / graphData.length;
    
    // Calculate trend (compare first half to second half)
    let trend = '--';
    if (graphData.length >= 2) {
        const midPoint = Math.floor(graphData.length / 2);
        const firstHalfAvg = graphData.slice(0, midPoint).reduce((sum, d) => sum + d.focus_score, 0) / midPoint;
        const secondHalfAvg = graphData.slice(midPoint).reduce((sum, d) => sum + d.focus_score, 0) / (graphData.length - midPoint);
        
        const diff = secondHalfAvg - firstHalfAvg;
        if (diff > 0.5) {
            trend = '↑ Improving';
        } else if (diff < -0.5) {
            trend = '↓ Declining';
        } else {
            trend = '→ Stable';
        }
    }
    
    if (avgFocusEl) avgFocusEl.textContent = avgFocus.toFixed(1);
    if (totalSessionsEl) totalSessionsEl.textContent = graphData.length;
    if (trendEl) trendEl.textContent = trend;
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
    // Load initial data
    loadProgressTrackerData();
    
    // Add event listener for subject filter
    const subjectFilter = document.getElementById('progressSubjectFilter');
    if (subjectFilter) {
        subjectFilter.addEventListener('change', function() {
            loadProgressTrackerData(this.value);
        });
    }
});
</script>
