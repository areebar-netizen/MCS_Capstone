<!-- Focus Track Setup Component -->
<div class="card focus-track-setup">
    <div class="card-header">
        <h2 class="card-title" id="cardTitle">Start Focus Track</h2>
        <p class="card-subtitle" id="cardSubtitle"></p>
    </div>

    <div class="card-content">

        <!-- VIEW 1: Setup -->
        <div id="setupView">
            <div class="focus-setup-shell">
                <label class="focus-label" for="sessionNameInput">Session Name</label>
                <input
                    type="text"
                    id="sessionNameInput"
                    class="focus-text-input"
                    placeholder="e.g. Deep Work, Study Session, Creative Flow"
                    maxlength="80"
                >

                <div class="duration-section">
                    <h3 class="section-title">Duration</h3>
                    <div class="duration-grid">
                        <button class="duration-btn btn-deselected" data-duration="15">15 min</button>

                        <div class="duration-option-wrap">
                            <button class="duration-btn btn-selected" data-duration="25">25 min</button>
                            <span class="duration-tag">Pomodoro</span>
                        </div>

                        <button class="duration-btn btn-deselected" data-duration="30">30 min</button>
                        <button class="duration-btn btn-deselected" data-duration="45">45 min</button>
                        <button class="duration-btn btn-deselected" data-duration="60">1 hour</button>
                        <button class="duration-btn btn-deselected" data-duration="90">90 min</button>
                    </div>
                </div>

                <label class="focus-label" for="customDurationInput">Custom Duration (minutes)</label>
                <input
                    type="number"
                    id="customDurationInput"
                    class="focus-text-input"
                    min="1"
                    max="360"
                    step="1"
                    value="25"
                >

                <button class="btn-primary btn-start focus-continue-btn" id="startSessionBtn" onclick="showCheckin()">
                    <span class="focus-continue-arrow">&#8594;</span>
                    <span>Continue to Pre-Session Check-In</span>
                </button>

                <div class="focus-note">
                    <span class="focus-note-icon" aria-hidden="true">&#9432;</span>
                    <p>
                        The pre-session check-in helps us provide better AI recommendations by understanding your
                        current state and goals. It takes less than 2 minutes.
                    </p>
                </div>
            </div>
        </div>

        <!-- VIEW 2: Pre-Session Check-In (inline) -->
        {% include 'presession_checkin.html'%}

        <!-- VIEW 3: Active Session -->
        <div class="active-session" id="activeSession" style="display: none;">
            <div class="timer-display">
                <span id="sessionTimer">00:00</span>
            </div>
            <div class="session-stats">
                <div class="stat">
                    <span class="stat-label">Elapsed</span>
                    <span class="stat-value" id="elapsedTime">00:00</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Check-ins</span>
                    <span class="stat-value" id="checkIns">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Avg Focus</span>
                    <span class="stat-value" id="avgFocus">--</span>
                </div>
            </div>
            <div class="session-controls">
                <button type="button" class="btn-danger" id="endBtn" onclick="stopEEGsession()">End Session</button>
            </div>
            <div class="session-controls">
                <pre id="sessionOutput"></pre>
            </div>
        </div>

    </div>
</div>

<script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            document.cookie.split(';').forEach(cookie => {
                cookie = cookie.trim();
                if (cookie.startsWith(name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                }
            });
        }
        return cookieValue;
    }

    let elapsedSeconds = 0;

    function showSetup() {
        document.getElementById('setupView').style.display = 'block';
        document.getElementById('checkinView').style.display = 'none';
        document.getElementById('activeSession').style.display = 'none';
        document.getElementById('cardTitle').textContent = 'Start Focus Track';
        document.getElementById('cardSubtitle').textContent = '';
    }

    function showCheckin() {
        document.getElementById('setupView').style.display = 'none';
        document.getElementById('checkinView').style.display = 'block';
        document.getElementById('activeSession').style.display = 'none';
        document.getElementById('cardTitle').textContent = 'Pre-Session Check-In';
        document.getElementById('cardSubtitle').textContent = 'Tell us about your current state and goals';

    function showActiveSession() {
        document.getElementById('setupView').style.display = 'none';

    // ---- Duration selection ----
    function setSelectedDuration(duration, fromCustomInput) {
        selectedDuration = duration;

        document.querySelectorAll('#setupView .duration-btn').forEach(btn => {
            if (Number(btn.dataset.duration) === duration && !fromCustomInput) {
                btn.classList.remove('btn-deselected');
                btn.classList.add('btn-selected');
            } else {
                btn.classList.remove('btn-selected');
                btn.classList.add('btn-deselected');
            }
        });

        const customInput = document.getElementById('customDurationInput');
        if (customInput && String(customInput.value) !== String(duration)) {
            customInput.value = duration;
        }

        console.log("Selected:", selectedDuration);
    }

    document.querySelectorAll('#setupView .duration-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            setSelectedDuration(Number(btn.dataset.duration), false);
        });
    });

    const customDurationInput = document.getElementById('customDurationInput');
    if (customDurationInput) {
        customDurationInput.addEventListener('input', () => {
            const value = Number(customDurationInput.value);
            if (Number.isFinite(value) && value >= 1) {
                setSelectedDuration(value, true);
            }
        });
    }

    setSelectedDuration(selectedDuration, false);

    // ---- Pre-session option toggle ----
    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('psc-opt')) {
            const group = e.target.dataset.group;
            document.querySelectorAll('.psc-opt[data-group="' + group + '"]').forEach(b => b.classList.remove('psc-opt-selected'));
            e.target.classList.add('psc-opt-selected');
        }
    });

    // ---- Slider live update ----

        var el = document.getElementById(id);

            });
        }
    });

    function collectPreSessionData() {
        var groups = ['subject','tasklength','mood','meal','caffeine','wake','activity','noise','lighting','method','location'];

        data.deadline = document.getElementById('psc-deadline').value;
        data.goal = document.getElementById('psc-goal').value;
        data.session_name = document.getElementById('sessionNameInput').value;
        return data;
    }

    async function confirmPreSessionAndStart() {
        console.log("BOTTOM BUTTON: confirmPreSessionAndStart fired");
        preSessionData = collectPreSessionData();
        console.log("Collected data:", JSON.stringify(preSessionData, null, 2));
        
        // Send pre-session data to backend
        try {
            const res = await fetch('/api/presession-checkin/', {
                method: "POST",
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                 },
                body: JSON.stringify(preSessionData)
            });
            const data = await res.json();
            console.log("Pre-session check-in response:", data);
            if (data.ok) {
                preSessionData.session_id = data.session_id;
                // Store session data to trigger timer on dashboard
                sessionStorage.setItem('session_name', preSessionData.session_name);
                sessionStorage.setItem('session_duration', selectedDuration);
                sessionStorage.setItem('start_timer', 'true');
                sessionStorage.setItem('session_id', data.session_id);  // Store session_id for EEG session linking
                // Redirect to dashboard to use dashboard's timer and brainwave logic
                window.location.href = '/dashboard/';
            } else {
                console.error("Failed to save pre-session check-in:", data.error);
                alert("Failed to save pre-session check-in. Please try again.");
            }
        } catch (err) {
            console.error("Error submitting pre-session check-in:", err);
            alert("Error submitting pre-session check-in. Please try again.");
        }
    }

    // ---- Timer ----
    function formatTime(totalSeconds) {
        var mins = Math.floor(totalSeconds / 60);
        var secs = totalSeconds % 60;
        return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function startTimer(durationMinutes) {
        console.log("Starting timer for", durationMinutes, "minutes");
        remainingSeconds = durationMinutes * 60;
        elapsedSeconds = 0;

        const sessionTimerEl = document.getElementById('sessionTimer');
        const elapsedTimeEl = document.getElementById('elapsedTime');
        
        if (sessionTimerEl) {
            sessionTimerEl.textContent = formatTime(remainingSeconds);
        }
        if (elapsedTimeEl) {
            elapsedTimeEl.textContent = formatTime(elapsedSeconds);
        }

        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(async function() {
            remainingSeconds -= 1;
            elapsedSeconds += 1;

            if (sessionTimerEl) {
                sessionTimerEl.textContent = formatTime(Math.max(remainingSeconds, 0));
            }
            if (elapsedTimeEl) {
                elapsedTimeEl.textContent = formatTime(elapsedSeconds);
            }

            if (remainingSeconds <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                console.log("Timer ended, stopping EEG session");
                await stopEEGsession();
            }
        }, 1000);
        
        console.log("Timer interval started");
    }

    // ---- EEG session ----
    async function startEEGsession() {
        console.log("starting EEG session");
        showActiveSession();
        startTimer(Number(selectedDuration));

        try {
            var res = await fetch('/start_realtime_eeg/', {
                method: "POST",
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                 },
                body: JSON.stringify({ duration_minutes: Number(selectedDuration) })
            });

            var data = await res.json();
            console.log(data);
            document.getElementById('sessionOutput').textContent = JSON.stringify(data, null, 2);

            if (res.ok) {
                console.log("EEG session started successfully");
                // Redirect to dashboard where brainwave box and recommendations exist
                window.location.href = '/dashboard/';
            }
        } catch (err) {
            console.error(err);
            document.getElementById('sessionOutput').textContent = "Start error: " + err;
        }
    }

    async function stopEEGsession() {
        console.log("Ending EEG session");

        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        // if (histogramPolling) {
        //     clearInterval(histogramPolling);
        //     histogramPolling = null;
        // }

        try {
            var res = await fetch('/stop_realtime_eeg/', {
                method: "POST",
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                 }
            });

            var data = await res.json();
            console.log(data);
            document.getElementById('sessionOutput').textContent = JSON.stringify(data, null, 2);

            
            if (data.status === 'completed' || data.status === "SUCCESS") {
                console.log("will recommend")
                window.location.href = '/dashboard/';
            } else if (data.status === 'processing' ||
                data.status === 'PENDING' ||
                data.status === 'running' ||
                data.status === 'STARTED') {
                setTimeout(stopEEGsession, 3000);
            } 
        } catch (err) {
            console.error(err);
            document.getElementById('sessionOutput').textContent = "Stop error: " + err;
        }
