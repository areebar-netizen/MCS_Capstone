﻿<!-- Focus Track Setup Component -->
<div class="card focus-track-setup">
    <div class="card-header">
        <h2 class="card-title" id="cardTitle">Focus Track Session</h2>
        <p class="card-subtitle" id="cardSubtitle">Start a new focus session</p>
    </div>

    <div class="card-content">

        <!-- VIEW 1: Setup -->
        <div id="setupView">
            <div class="duration-section">
                <h3 class="section-title">Select Duration</h3>
                <div class="duration-grid">
                    <button class="duration-btn btn-deselected" data-duration="1">1 min</button>
                    <button class="duration-btn btn-deselected" data-duration="15">15 min</button>
                    <button class="duration-btn btn-deselected" data-duration="25">25 min</button>
                    <button class="duration-btn btn-deselected" data-duration="30">30 min</button>
                    <button class="duration-btn btn-deselected" data-duration="45">45 min</button>
                    <button class="duration-btn btn-deselected" data-duration="60">60 min</button>
                    <button class="duration-btn btn-deselected" data-duration="90">90 min</button>
                </div>
            </div>
            <div class="session-controls">
                <button class="btn-primary btn-start" id="startSessionBtn" onclick="showCheckin()">
                    <span>Start Focus Session</span>
                </button>
            </div>
        </div>

        <!-- VIEW 2: Pre-Session Check-In (inline) -->
        {% include 'presession_checkin.html'%}

        <!-- VIEW 3: Active Session -->
        <div class="active-session" id="activeSession" style="display: none;">
            <div class="timer-display">
                <span id="sessionTimer">00:00</span>
            </div>
            <div class="session-stats">
                <div class="stat">
                    <span class="stat-label">Elapsed</span>
                    <span class="stat-value" id="elapsedTime">00:00</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Check-ins</span>
                    <span class="stat-value" id="checkIns">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Avg Focus</span>
                    <span class="stat-value" id="avgFocus">--</span>
                </div>
            </div>
            <div class="session-controls">
                <button type="button" class="btn-danger" id="endBtn" onclick="stopEEGsession()">End Session</button>
            </div>
            <div class="session-controls">
                <pre id="sessionOutput"></pre>
            </div>
        </div>

    </div>
</div>

<style>
.psc-section { margin-bottom: 16px; }
.psc-label { display:block; margin-bottom:7px; font-weight:600; font-size:0.85rem; color:#333; }
.psc-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:7px; }
.psc-grid-2 { grid-template-columns: 1fr 1fr; }
.psc-opt {
    padding: 8px 10px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
    font-size: 0.83rem;
    cursor: pointer;
    text-align: center;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
    color: #333;
}
.psc-opt:hover { border-color: #e05a2b; background: #fff5f1; }
.psc-opt-selected { background: #e05a2b !important; color: #fff !important; border-color: #e05a2b !important; }
.psc-slider { width:100%; accent-color:#e05a2b; margin:6px 0 2px; }
.psc-slider-val { text-align:center; font-size:1.3rem; font-weight:600; color:#222; }
.psc-slider-labels { display:flex; justify-content:space-between; font-size:0.72rem; color:#aaa; margin-top:2px; }
.psc-select { width:100%; padding:8px 11px; border:1px solid #ddd; border-radius:8px; font-size:0.88rem; background:#fafafa; }
.psc-textarea { width:100%; padding:9px 11px; border:1px solid #ddd; border-radius:8px; font-size:0.88rem; resize:vertical; min-height:65px; background:#fafafa; box-sizing:border-box; }
.psc-footer { display:flex; gap:10px; margin-top:22px; }
.psc-back-btn { flex:1; padding:11px; border:2px solid #e05a2b; background:#fff; color:#e05a2b; border-radius:8px; font-size:0.92rem; cursor:pointer; font-weight:500; }
.psc-start-btn { flex:2; padding:11px; background:#e05a2b; color:#fff; border:none; border-radius:8px; font-size:0.92rem; cursor:pointer; font-weight:600; }
.psc-back-btn:hover { background:#fff5f1; }
.psc-start-btn:hover { background:#c94d22; }
</style>

<script>
    let selectedDuration = 1;
    let timerInterval = null;
    let remainingSeconds = 0;
    let elapsedSeconds = 0;
    let preSessionData = {};

    // ---- View switching ----
    function showSetup() {
        document.getElementById('setupView').style.display = 'block';
        document.getElementById('checkinView').style.display = 'none';
        document.getElementById('activeSession').style.display = 'none';
        document.getElementById('cardTitle').textContent = 'Focus Track Session';
        document.getElementById('cardSubtitle').textContent = 'Start a new focus session';
    }

    function showCheckin() {
        document.getElementById('setupView').style.display = 'none';
        document.getElementById('checkinView').style.display = 'block';
        document.getElementById('activeSession').style.display = 'none';
        document.getElementById('cardTitle').textContent = 'Pre-Session Check-In';
        document.getElementById('cardSubtitle').textContent = 'Tell us about your current state and goals';
    }

    function showActiveSession() {
        document.getElementById('setupView').style.display = 'none';
        document.getElementById('checkinView').style.display = 'none';
        document.getElementById('activeSession').style.display = 'block';
        document.getElementById('cardTitle').textContent = 'Focus Track Session';
        document.getElementById('cardSubtitle').textContent = 'Session in progress';
    }

    // ---- Duration selection ----
    document.querySelectorAll('.duration-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.duration-btn').forEach(b => {
                b.classList.remove('btn-selected');
                b.classList.add('btn-deselected');
            });
            btn.classList.remove('btn-deselected');
            btn.classList.add('btn-selected');
            selectedDuration = Number(btn.dataset.duration);
            console.log("Selected:", selectedDuration);
        });
    });

    // ---- Pre-session option toggle ----
    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('psc-opt')) {
            const group = e.target.dataset.group;
            document.querySelectorAll('.psc-opt[data-group="' + group + '"]').forEach(b => b.classList.remove('psc-opt-selected'));
            e.target.classList.add('psc-opt-selected');
        }
    });

    // ---- Slider live update ----
    ['psc-difficulty', 'psc-energy', 'psc-stress'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) {
            el.addEventListener('input', function() {
                document.getElementById(id + '-val').textContent = el.value + '/10';
            });
        }
    });

    function collectPreSessionData() {
        var groups = ['subject','tasklength','mood','meal','caffeine','wake','activity','noise','lighting','method','location'];
        var data = {};
        groups.forEach(function(g) {
            var sel = document.querySelector('#checkinView .psc-opt-selected[data-group="' + g + '"]');
            data[g] = sel ? sel.dataset.val : null;
        });
        data.difficulty = document.getElementById('psc-difficulty').value;
        data.energy = document.getElementById('psc-energy').value;
        data.stress = document.getElementById('psc-stress').value;
        data.deadline = document.getElementById('psc-deadline').value;
        data.goal = document.getElementById('psc-goal').value;
        return data;
    }

    function confirmPreSessionAndStart() {
        preSessionData = collectPreSessionData();
        startEEGsession();
    }

    // ---- Timer ----
    function formatTime(totalSeconds) {
        var mins = Math.floor(totalSeconds / 60);
        var secs = totalSeconds % 60;
        return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function startTimer(durationMinutes) {
        remainingSeconds = durationMinutes * 60;
        elapsedSeconds = 0;

        document.getElementById('sessionTimer').textContent = formatTime(remainingSeconds);
        document.getElementById('elapsedTime').textContent = formatTime(elapsedSeconds);

        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(async function() {
            remainingSeconds -= 1;
            elapsedSeconds += 1;

            document.getElementById('sessionTimer').textContent = formatTime(Math.max(remainingSeconds, 0));
            document.getElementById('elapsedTime').textContent = formatTime(elapsedSeconds);

            if (remainingSeconds <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                console.log("Timer ended, stopping EEG session");
                await stopEEGsession();
            }
        }, 1000);
    }

    // ---- EEG session ----
    async function startEEGsession() {
        console.log("starting EEG session");

        try {
            var res = await fetch('/start_eeg/', {
                method: "POST",
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ duration_minutes: Number(selectedDuration) })
            });

            var data = await res.json();
            console.log(data);
            document.getElementById('sessionOutput').textContent = JSON.stringify(data, null, 2);

            if (res.ok) {
                showActiveSession();
                startTimer(Number(selectedDuration));
                // Start polling for histogram data
                startHistogramPolling();
            }
        } catch (err) {
            console.error(err);
            document.getElementById('sessionOutput').textContent = "Start error: " + err;
        }
    }

    function startHistogramPolling() {
        // Reset data
        focusHistogramData = [];
        focusHistogramLabels = [];
        if (focusHistogramChart) {
            focusHistogramChart.data.labels = [];
            focusHistogramChart.data.datasets[0].data = [];
            focusHistogramChart.update();
        }
        if (histogramPolling) clearInterval(histogramPolling);
        histogramPolling = setInterval(fetchHistogramData, 1000);
    }

    async function fetchHistogramData() {
        // Example: fetch from a new endpoint that returns real-time focus data array
        try {
            const res = await fetch('/realtime_eeg_status/', { method: 'GET' });
            const status = await res.json();
            if (status.ok && status.result && status.result.data_points) {
                // data_points: [{timestamp, focus_score, ...}]
                focusHistogramLabels = status.result.data_points.map(p => p.timestamp);
                focusHistogramData = status.result.data_points.map(p => p.focus_score);
                if (focusHistogramChart) {
                    focusHistogramChart.data.labels = focusHistogramLabels;
                    focusHistogramChart.data.datasets[0].data = focusHistogramData;
                    focusHistogramChart.update();
                }
                // Show info below
                if (focusHistogramInfo && status.result.final_summary) {
                    const s = status.result.final_summary;
                    focusHistogramInfo.innerHTML = `Avg: ${(s.average_focus_score*100).toFixed(1)}% | Peak: ${(s.peak_focus_score*100).toFixed(1)}% | Duration: ${Math.floor(s.total_duration_seconds/60)}m ${(s.total_duration_seconds%60)}s`;
                }
            }
        } catch (e) {
            // Ignore errors during polling
        }
    }

    async function stopEEGsession() {
        console.log("Ending EEG session");

        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        if (histogramPolling) {
            clearInterval(histogramPolling);
            histogramPolling = null;
        }

        try {
            var res = await fetch('/stop_eeg/', {
                method: "POST",
                headers: { 'Content-Type': 'application/json' }
            });

            var data = await res.json();
            console.log(data);
            document.getElementById('sessionOutput').textContent = JSON.stringify(data, null, 2);

            if (data.status !== 'completed' && data.status !== 'no_predictions') {
                setTimeout(stopEEGsession, 1000);
            }
        } catch (err) {
            console.error(err);
            document.getElementById('sessionOutput').textContent = "Stop error: " + err;
        }
    }
</script>
