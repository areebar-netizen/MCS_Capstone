<!-- Focus Track Setup Component -->
<div class="card focus-track-setup">
    <div class="card-header">
        <h2 class="card-title">Focus Track Session</h2>
        <p class="card-subtitle">Start a new focus session</p>
    </div>
    
    <div class="card-content">
        <!-- Duration Selection -->
        <div class="duration-section">
            <h3 class="section-title">Select Duration</h3>
            <div class="duration-grid">
                <button class="duration-btn btn-deselected" data-duration="1">1 min</button>
                <button class="duration-btn btn-deselected" data-duration="15">15 min</button>
                <button class="duration-btn btn-deselected" data-duration="25">25 min</button>
                <button class="duration-btn btn-deselected" data-duration="30">30 min</button>
                <button class="duration-btn btn-deselected" data-duration="45">45 min</button>
                <button class="duration-btn btn-deselected" data-duration="60">60 min</button>
                <button class="duration-btn btn-deselected" data-duration="90">90 min</button>
            </div>
        </div>

        <!-- Real-time Focus Histogram -->
        <div id="focusHistogramContainer" style="display:none; margin-top:24px;">
            <canvas id="focusHistogram" height="120"></canvas>
            <div id="focusHistogramInfo" style="margin-top:12px; text-align:center;"></div>
        </div>

        <!-- Session Controls -->
        <div class="session-controls">
            <button class="btn-primary btn-start" id="startSessionBtn" onclick = "startEEGsession()">
                <span>Start Focus Session</span>
            </button>
        </div>

        <!-- Active Session Display (Hidden by default) -->
        <div class="active-session" id="activeSession" style="display: none;">
            <div class="timer-display">
                <span id="sessionTimer">00:00</span>
            </div>
            <div class="session-stats">
                <div class="stat">
                    <span class="stat-label">Elapsed</span>
                    <span class="stat-value" id="elapsedTime">00:00</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Check-ins</span>
                    <span class="stat-value" id="checkIns">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Avg Focus</span>
                    <span class="stat-value" id="avgFocus">--</span>
                </div>
            </div>
            <div class="session-controls">
                <button type = "button" class="btn-danger" id="endBtn" onclick = " stopEEGsession()">End Session</button>
            </div>
            <div class = "session-controls">
                <pre id = "sessionOutput"></pre>
            </div>  
        </div>
        
    </div>
</div>

<script>
    let selectedDuration = 1;
    let timerInterval = null;
    let remainingSeconds = 0;
    let elapsedSeconds = 0;

    // Histogram state
    let focusHistogramChart = null;
    let focusHistogramData = [];
    let focusHistogramLabels = [];
    let focusHistogramInfo = null;
    let histogramPolling = null;

    // Load Chart.js dynamically
    const chartJsScript = document.createElement('script');
    chartJsScript.src = '/static/js/load_chartjs.js';
    document.head.appendChild(chartJsScript);

    // Called after Chart.js loads
    window.initFocusHistogram = function() {
        const ctx = document.getElementById('focusHistogram').getContext('2d');
        focusHistogramChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [],
                datasets: [{
                    label: 'Focus Score',
                    data: [],
                    backgroundColor: 'rgba(54, 162, 235, 0.6)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                animation: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 1
                    }
                }
            }
        });
        focusHistogramInfo = document.getElementById('focusHistogramInfo');
    };

    document.querySelectorAll('.duration-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.duration-btn').forEach(b => {
                b.classList.remove('btn-selected');
                b.classList.add('btn-deselected');
            });

            btn.classList.remove('btn-deselected');
            btn.classList.add('btn-selected');

            selectedDuration = Number(btn.dataset.duration);
            console.log("Selected:", selectedDuration);
        });
    });

    function formatTime(totalSeconds) {
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function startTimer(durationMinutes) {
        remainingSeconds = durationMinutes * 60;
        elapsedSeconds = 0;

        document.getElementById('sessionTimer').textContent = formatTime(remainingSeconds);
        document.getElementById('elapsedTime').textContent = formatTime(elapsedSeconds);

        if (timerInterval) {
            clearInterval(timerInterval);
        }

        timerInterval = setInterval(async () => {
            remainingSeconds -= 1;
            elapsedSeconds += 1;

            document.getElementById('sessionTimer').textContent = formatTime(Math.max(remainingSeconds, 0));
            document.getElementById('elapsedTime').textContent = formatTime(elapsedSeconds);

            if (remainingSeconds <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                console.log("Timer ended, stopping EEG session");
                await stopEEGsession();
            }
        }, 1000);
    }

    async function startEEGsession() {
        console.log("starting EEG session");

        try {
            const res = await fetch('/start_eeg/', {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    duration_minutes: Number(selectedDuration)
                })
            });

            const data = await res.json();
            console.log(data);

            document.getElementById('sessionOutput').textContent = JSON.stringify(data, null, 2);

            if (res.ok) {
                document.getElementById('activeSession').style.display = 'block';
                document.getElementById('focusHistogramContainer').style.display = 'block';
                startTimer(Number(selectedDuration));
                // Start polling for histogram data
                startHistogramPolling();
            }
        } catch (err) {
            console.error(err);
            document.getElementById('sessionOutput').textContent = "Start error: " + err;
        }
    }

    function startHistogramPolling() {
        // Reset data
        focusHistogramData = [];
        focusHistogramLabels = [];
        if (focusHistogramChart) {
            focusHistogramChart.data.labels = [];
            focusHistogramChart.data.datasets[0].data = [];
            focusHistogramChart.update();
        }
        if (histogramPolling) clearInterval(histogramPolling);
        histogramPolling = setInterval(fetchHistogramData, 1000);
    }

    async function fetchHistogramData() {
        // Example: fetch from a new endpoint that returns real-time focus data array
        try {
            const res = await fetch('/realtime_eeg_status/', { method: 'GET' });
            const status = await res.json();
            if (status.ok && status.result && status.result.data_points) {
                // data_points: [{timestamp, focus_score, ...}]
                focusHistogramLabels = status.result.data_points.map(p => p.timestamp);
                focusHistogramData = status.result.data_points.map(p => p.focus_score);
                if (focusHistogramChart) {
                    focusHistogramChart.data.labels = focusHistogramLabels;
                    focusHistogramChart.data.datasets[0].data = focusHistogramData;
                    focusHistogramChart.update();
                }
                // Show info below
                if (focusHistogramInfo && status.result.final_summary) {
                    const s = status.result.final_summary;
                    focusHistogramInfo.innerHTML = `Avg: ${(s.average_focus_score*100).toFixed(1)}% | Peak: ${(s.peak_focus_score*100).toFixed(1)}% | Duration: ${Math.floor(s.total_duration_seconds/60)}m ${(s.total_duration_seconds%60)}s`;
                }
            }
        } catch (e) {
            // Ignore errors during polling
        }
    }

    async function stopEEGsession() {
        console.log("Ending EEG session");

        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        if (histogramPolling) {
            clearInterval(histogramPolling);
            histogramPolling = null;
        }

        try {
            const res = await fetch('/stop_eeg/', {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            const data = await res.json();
            console.log(data);
            document.getElementById('sessionOutput').textContent = JSON.stringify(data, null, 2);

            if (data.status !== 'completed' && data.status !== 'no_predictions') {
                setTimeout(stopEEGsession, 1000);
            }
        } catch (err) {
            console.error(err);
            document.getElementById('sessionOutput').textContent = "Stop error: " + err;
        }
    }
        
</script>
